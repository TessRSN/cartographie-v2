<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panneau de la cartographie du RSN</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <link rel="icon" type="image/png" href="/icone-rsn.png">
    <!-- Le choix de mode clair ou sombre fait sur le site est repris ici ; sans choix, le panneau suit l'appareil. -->
    <script>(function(){try{var c=localStorage.getItem('rsn-theme');if(c==='dark'||c==='light')document.documentElement.setAttribute('data-theme',c);}catch(e){}})();</script>
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

<div class="top"><div class="top-in">
    <div class="brand"><span class="blogo"><img src="/logo-rsn-blanc.webp" width="150" height="40" alt="Logo du RSN"></span><div><b id="marqueReseau">Réseau santé numérique</b><span id="marquePanneau">Administration de la cartographie</span></div></div>
    <div class="who">
        <span id="quiNom"></span>
        <span class="role" id="quiRole"></span>
        <button class="tbtn" id="boutonTheme" type="button"></button>
        <button class="tbtn" id="deconnexion" type="button" hidden></button>
    </div>
</div></div>

<div class="shell seule" id="coque">
    <nav class="side" id="nav" aria-label="Sections du panneau" hidden></nav>
    <main id="main">
        <p class="muted">Chargement…</p>
        <noscript><p class="muted">Cette page a besoin de JavaScript.</p></noscript>
    </main>
</div>
<div id="layer"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="/js/texte.js"></script>
<script src="/js/champs.js"></script>
<script src="/js/comparaison.js"></script>
<script src="/js/versions.js"></script>
<script src="/js/fiche.js"></script>
<script src="/js/gabarits.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
