<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposer une ressource | Cartographie du RSN</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <link rel="icon" type="image/png" href="/icone-rsn.png">
    <script>(function(){try{var c=localStorage.getItem('rsn-theme');if(c==='dark'||(!c&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/formulaires.css">
</head>
<body class="page-formulaire">

<header class="header">
    <a href="/" class="header-home" aria-label="Retour à l'accueil de la cartographie"><img class="header-logo" src="/logo-rsn-blanc.webp" width="150" height="40" alt="Logo du RSN"></a>
    <div class="header-main">
        <div class="header-title"><h1>Cartographie des ressources en santé numérique</h1></div>
    </div>
    <div class="header-controls">
        <a class="header-btn" href="/">Retour à la cartographie</a>
        <button type="button" class="header-btn" id="boutonTheme" aria-label="Changer de mode clair ou sombre">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
    </div>
</header>

<main class="formulaire-page" id="proposer" aria-live="polite">
    <p class="formulaire-attente">Chargement…</p>
    <noscript><p class="formulaire-attente">Ce formulaire a besoin de JavaScript.</p></noscript>
</main>

<script src="/js/texte.js"></script>
<script src="/js/champs.js"></script>
<script src="/js/proposer.js"></script>
</body>
</html>
